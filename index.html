<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | สมัครเรียนวิทยาการคอมพิวเตอร์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://cdn.spline.design/@splinetool/viewer@2.0.75/build/spline-viewer.js"></script>
    <script>
      (function() {
        function cleanSplineLogo() {
          document.querySelectorAll('spline-viewer').forEach(function(viewer) {
            if (viewer && viewer.shadowRoot) {
              if (!viewer.shadowRoot.querySelector('#hide-spline-logo-style')) {
                var style = document.createElement('style');
                style.id = 'hide-spline-logo-style';
                style.textContent = '#logo { display: none !important; opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; width: 0 !important; height: 0 !important; }';
                viewer.shadowRoot.appendChild(style);
              }
              var logo = viewer.shadowRoot.querySelector('#logo');
              if (logo) {
                logo.style.setProperty('display', 'none', 'important');
                logo.remove();
              }
            }
          });
        }
        var obs = new MutationObserver(cleanSplineLogo);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', cleanSplineLogo);
        setInterval(cleanSplineLogo, 200);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
